; pytest 配置：固定 rootdir 与 sys.path，让"从仓库根跑"和"从 sidecar/ 跑"结果一致。
;
; 背景（2026-09-23 审计）：仓库原先没有 pyproject.toml / pytest.ini，rootdir 与
; pythonpath 全靠 CWD —— tests/test_control_tools.py 用相对路径加载插件，从仓库根
; 跑会去找 <repo>/plugins/…（不存在）→ 4 个用例失败、824 通过；从 sidecar/ 跑则
; 828 全过。CI 从仓库根跑，若不一致就会假红/假绿。
;
; testpaths：只收 tests/，避免把 vendored 的 sidecar/python/ 当成测试目录。
; pythonpath：把 sidecar/ 注入 sys.path（等价于在 sidecar/ 下运行），
;             测试里 `import agent_loop` 之类不依赖 CWD。
[pytest]
testpaths = tests
pythonpath = .
