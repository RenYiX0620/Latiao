name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - run: npm install

      - name: Guard: signing key configured?
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_PRIVATE_KEY secret not configured - aborting release job to avoid unsigned artifacts overwriting latest.json"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      - name: Build (updater 插件自动产出签名更新包)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          cd sidecar
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          cd ..
          npm run tauri build

      - name: Prepare updater archive (fallback 手动打包+签名)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          BUNDLE="src-tauri/target/release/bundle"
          VERSION="${GITHUB_REF_NAME#v}"
          case "$(uname -m)" in arm64) ARCH="aarch64" ;; *) ARCH="x86_64" ;; esac
          ARCHIVE="$BUNDLE/macos/Latiao_${VERSION}_${ARCH}.app.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            APP=$(ls -d "$BUNDLE"/macos/*.app | head -1)
            cd "$BUNDLE/macos" && tar czf "$(basename "$ARCHIVE")" "$(basename "$APP")" && cd -
            npx @tauri-apps/cli signer sign --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$ARCHIVE"
          fi
          ls -la "$BUNDLE/macos"

      - name: Generate latest.json (darwin 条目)
        run: |
          BUNDLE="src-tauri/target/release/bundle"
          VERSION="${GITHUB_REF_NAME#v}"
          case "$(uname -m)" in arm64) ARCH="aarch64" ;; *) ARCH="x86_64" ;; esac
          ARCHIVE="$BUNDLE/macos/Latiao_${VERSION}_${ARCH}.app.tar.gz"
          SIG=$(cat "$ARCHIVE.sig" | tr -d '\n')
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Latiao v$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-$ARCH": {
                "signature": "$SIG",
                "url": "https://github.com/RenYiX0620/Latiao/releases/download/${GITHUB_REF_NAME}/Latiao_${VERSION}_${ARCH}.app.tar.gz"
              }
            }
          }
          EOF
          echo "Manifest: $(cat latest.json)"

      - name: Upload release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            latest.json
          draft: false
          generate_release_notes: true

  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - run: npm install

      - name: Guard: signing key configured?
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::error::TAURI_PRIVATE_KEY secret not configured - aborting release job to avoid unsigned artifacts overwriting latest.json"
            exit 1
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      - name: Build sidecar (PyInstaller)
        run: |
          cd sidecar
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.*"
          python -m PyInstaller latiao.spec
          Copy-Item dist/sidecar.exe -Destination . -Force

      - name: Download llama-server.exe
        run: |
          $headers = @{ "User-Agent" = "Latiao-CI" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" -Headers $headers
          $tag = $release.tag_name
          $zipUrl = "https://github.com/ggml-org/llama.cpp/releases/download/$tag/llama-$tag-bin-win-cpu-x64.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile "$env:RUNNER_TEMP\llama.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\llama.zip" -DestinationPath "$env:RUNNER_TEMP\llama" -Force
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\llama" -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "sidecar\llama-server.exe" -Force

      - name: Build Tauri (NSIS + MSI，updater 自动签名)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Sign NSIS installer (fallback 手动签名)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          $BUNDLE = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $exe = Get-ChildItem -Path "$BUNDLE\nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($exe -and -not (Test-Path "$($exe.FullName).sig")) {
            npx @tauri-apps/cli signer sign --password $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD $exe.FullName
          }
          Get-ChildItem -Path "$BUNDLE\nsis" | Select-Object Name

      - name: Append windows-x86_64 to latest.json and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          $BUNDLE = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $exe = Get-ChildItem -Path "$BUNDLE\nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host "No NSIS installer - skipping manifest entry"; exit 0 }
          # 等 mac job 先上传 latest.json（重试 10 次 × 10s）
          for ($i = 0; $i -lt 10; $i++) {
            gh release download $env:GITHUB_REF_NAME --repo RenYiX0620/Latiao --pattern latest.json --clobber 2>$null
            if ($LASTEXITCODE -eq 0 -and (Test-Path latest.json)) { break }
            Start-Sleep -Seconds 10
          }
          if (-not (Test-Path latest.json)) {
            # mac job 未产出清单：自建仅 windows 条目（mac 条目由 mac job 补）
            $man = @{ version = $VERSION; notes = "Latiao v$VERSION";
                      pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ");
                      platforms = @{} }
          } else {
            $man = Get-Content latest.json -Raw | ConvertFrom-Json
          }
          $sig = (Get-Content "$($exe.FullName).sig" -Raw) -replace "`r|`n", ""
          $url = "https://github.com/RenYiX0620/Latiao/releases/download/$env:GITHUB_REF_NAME/$($exe.Name)"
          $entry = [ordered]@{ signature = $sig; url = $url }
          $man.platforms | Add-Member -NotePropertyName "windows-x86_64" -NotePropertyValue $entry -Force
          $man | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding UTF8
          gh release upload $env:GITHUB_REF_NAME latest.json --repo RenYiX0620/Latiao --clobber

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          draft: false
          generate_release_notes: true
