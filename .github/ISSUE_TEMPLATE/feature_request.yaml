name: ✨ 功能建议 / Feature Request
description: suggest an idea / 提个想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题 / What problem
      description: 这个功能帮你解决什么痛点？或者你希望 Agent 能做到什么现在做不到的事？
      placeholder: "每次都要手动...，希望辣条能..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Desired solution
      description: 你设想它怎么工作？界面交互、触发方式、输出形式——任何细节都有帮助
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: 其他软件怎么做的？为什么不够好？
  - type: checkboxes
    id: terms
    attributes:
      label: 确认 / Confirm
      options:
        - label: 我已搜索过现有 issues 和 discussions，没有重复建议。
          required: true
