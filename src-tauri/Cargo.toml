[package]
name = "local-ai-os"
version = "0.3.44"
description = "Integrated Local AI Agent + Local Model"
authors = ["RenYiX0620"]
license = "MIT"
repository = "https://github.com/RenYiX0620/Latiao"
edition = "2021"

[lints]
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mobile)"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde_json = "1"
# ③ Windows token 随机源：不用时间戳+PID（可枚举），统一走操作系统随机源
getrandom = "0.3"

[features]
default = ["default-tauri"]
default-tauri = ["tauri/default"]
devtools = ["tauri/devtools"]
